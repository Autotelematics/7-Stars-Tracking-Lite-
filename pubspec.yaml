name: autotelematic_new_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.6+8

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_maps_flutter: ^2.12.2
  shared_preferences: ^2.5.3
  http: ^1.4.0
  fluttertoast: ^9.1.0
  url_launcher: ^6.3.1
  maps_launcher: ^3.0.0+1
  path_provider: ^2.1.5
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  connectivity_plus: ^7.3.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  syncfusion_flutter_pdfviewer: ^33.2.13
  syncfusion_flutter_gauges: ^33.2.15
  fluster: ^1.2.0
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  firebase_core: ^4.12.1
  firebase_core_web: ^3.9.1
  firebase_messaging: ^16.4.3
  sliding_up_panel: ^2.0.0+1
  getwidget: ^7.0.0
  provider: ^6.1.5
  animated_marker: ^0.3.1
  share_plus: ^13.3.0
  device_info_plus: ^13.2.0
  responsive_sizer: ^3.3.1
  flutter_svg: ^2.3.0
  geolocator: ^14.0.1
  shimmer: ^3.0.0
  permission_handler: ^12.0.3
  flutter_spinkit: ^5.2.2
  dropdown_button2: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/appicon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/ios/
    - assets/documents/World_Telematics_Privacy_Policy.pdf
    - assets/documents/World_Telematics_Terms_and_Conditions.pdf

  fonts:
    - family: Digital
      fonts:
        - asset: assets/fonts/digital-7.ttf
